# общие настройки для всех узлов MongoDB
x-mongo-node: &mongo-node
  image: dh-mirror.gitverse.ru/mongo:latest
  restart: always
  networks:
    - app-network

services:

  # сервер конфигурации
  configSrv:
    <<: *mongo-node
    container_name: configSrv
    ports:
      - "27017:27017"
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",          # запуск в режиме сервера конфигурации
        "--replSet",
        "config_server",        # название реплики сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  # 1-й шард: реплика shard1 из трёх узлов
  shard1-1:
    <<: *mongo-node
    container_name: shard1-1
    ports:
      - "27018:27018"
    volumes:
      - shard1-1-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard1-2:
    <<: *mongo-node
    container_name: shard1-2
    ports:
      - "27021:27021"
    volumes:
      - shard1-2-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27021" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27021", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard1-3:
    <<: *mongo-node
    container_name: shard1-3
    ports:
      - "27022:27022"
    volumes:
      - shard1-3-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27022" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27022", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  # 2-й шард: реплика shard2 из трёх узлов
  shard2-1:
    <<: *mongo-node
    container_name: shard2-1
    ports:
      - "27019:27019"
    volumes:
      - shard2-1-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard2-2:
    <<: *mongo-node
    container_name: shard2-2
    ports:
      - "27023:27023"
    volumes:
      - shard2-2-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27023" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27023", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard2-3:
    <<: *mongo-node
    container_name: shard2-3
    ports:
      - "27024:27024"
    volumes:
      - shard2-3-data:/data/db
    command: [ "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27024" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27024", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  # роутер
  mongos_router:
    <<: *mongo-node
    container_name: mongos_router
    ports:
      - "27020:27020"
    command:
      [
        "mongos",                         # mongo в режиме роутера
        "--configdb",
        "config_server/configSrv:27017",  # адрес реплики сервера конфигурации
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  # приложение
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router  # без condition: service_healthy — роутер не «здоров», пока не выполнен mongo-init.sh
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"  # приложение работает через роутер
      MONGODB_DATABASE_NAME: "somedb"

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
